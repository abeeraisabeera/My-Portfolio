# Syncs new public GitHub repos into data/projects.json (curated entries are preserved).
# Edit tags, descriptions, and stack in projects.json — the workflow only appends unknown repos.
name: Sync portfolio projects

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'  # Daily 08:00 UTC — picks up new repos within ~24h
  repository_dispatch:
    types: [portfolio-sync]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync repos into projects.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: abeeraisabeera
          IGNORE_REPOS: 'Portfolio'
        run: node .github/scripts/sync-projects.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json
          if git diff --staged --quiet; then
            echo "No changes to projects.json"
          else
            git commit -m "chore: sync projects from GitHub"
            git push
          fi
